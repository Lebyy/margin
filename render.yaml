# Render Blueprint for Askretes: the Next.js site (frontend/) and the Express API (backend/).
#
# The API runs as one always-on Node process because Talk holds a WebSocket open
# and uploaded attachments are kept in that process's memory between the upload
# and the message, neither of which works on serverless functions.
#
# The two services name each other by their public addresses: the site is built
# with NEXT_PUBLIC_API_BASE (baked in at build time, so changing it needs a
# redeploy of the site), and the API answers only the origins in WEB_ORIGINS
# (backend/src/origins.ts). Render gives a service <name>.onrender.com when that
# name is free; if it adds a suffix, update both values to the real addresses.
#
# Secrets are marked sync: false: Render asks for them once in its dashboard and
# they never live in this repo.
services:
  - type: web
    name: askretes-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.19.0"
      - key: STORAGE_DRIVER
        value: gcs
      - key: GCS_BUCKET
        value: askretes-student-files-62090fbe
      # Every address the site is served from: the custom domain and its www, and Render's own address.
      - key: WEB_ORIGINS
        value: https://askretes.us,https://www.askretes.us,https://askretes-web.onrender.com
      - key: LLM_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GCS_KEY_BASE64
        sync: false

  - type: web
    name: askretes-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    # next start listens on Render's PORT on its own.
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.19.0"
      - key: NEXT_PUBLIC_API_BASE
        value: https://askretes-api.onrender.com
